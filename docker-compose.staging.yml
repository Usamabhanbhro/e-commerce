services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: usamabhanbhro_staging
      POSTGRES_USER: staging_app
      POSTGRES_PASSWORD: replace-with-local-staging-db-password
    ports:
      - "5433:5432"
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: replace-with-local-staging-storage-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - staging_minio:/data

volumes:
  staging_postgres:
  staging_minio:
