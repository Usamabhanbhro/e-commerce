name: Validate staging image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: staging_ci
          POSTGRES_USER: staging_ci
          POSTGRES_PASSWORD: staging_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staging_ci -d staging_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Verify PostgreSQL migration and integrity
        env:
          DATABASE_URL: postgresql://staging_ci:staging_ci@127.0.0.1:5432/staging_ci
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:verify

      - name: Build production server and Pages artifact
        run: |
          pnpm build
          pnpm build:pages

      - name: Scan release files
        run: pnpm scan:release

      - name: Build staging container
        run: docker build --tag usamabhanbhro-ecommerce-staging:${{ github.sha }} .
