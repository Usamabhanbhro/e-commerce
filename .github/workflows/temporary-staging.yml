name: Temporary staging

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: Minutes to keep the temporary runner and tunnel available (5-120)
        required: false
        default: "30"
        type: string
      deploy_pages:
        description: Publish a temporary GitHub Pages build that points at the tunnel URL
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: temporary-staging
  cancel-in-progress: true

jobs:
  staging:
    name: Run temporary Express staging
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: staging_ci
          POSTGRES_USER: staging_ci
          POSTGRES_PASSWORD: staging_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staging_ci -d staging_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: staging
      NODE_ENV: production
      PORT: 4177
      DATABASE_URL: postgresql://staging_ci:staging_ci@127.0.0.1:5432/staging_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      PAYMENT_MODE: mock
      PAYMENT_PROVIDER_ADAPTER: demo
      FRONTEND_ORIGIN: https://usamabhanbhro.github.io
      ALLOWED_ORIGINS: https://usamabhanbhro.github.io
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required staging secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          }
          check_required JWT_SECRET "${JWT_SECRET:-}"
          check_required PAYMENT_WEBHOOK_SECRET "${PAYMENT_WEBHOOK_SECRET:-}"
          check_required S3_ENDPOINT "${S3_ENDPOINT:-}"
          check_required S3_REGION "${S3_REGION:-}"
          check_required S3_BUCKET "${S3_BUCKET:-}"
          check_required S3_ACCESS_KEY_ID "${S3_ACCESS_KEY_ID:-}"
          check_required S3_SECRET_ACCESS_KEY "${S3_SECRET_ACCESS_KEY:-}"
          check_required S3_FORCE_PATH_STYLE "${S3_FORCE_PATH_STYLE:-}"
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Temporary staging is blocked. Configure these GitHub repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ] || [ "${#PAYMENT_WEBHOOK_SECRET}" -lt 32 ]; then
            echo '::error::JWT_SECRET and PAYMENT_WEBHOOK_SECRET must each be at least 32 characters.'
            exit 1
          fi

      - name: Validate keep-alive input
        shell: bash
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          case "$KEEP_ALIVE_MINUTES" in
            ''|*[!0-9]*) echo '::error::keep_alive_minutes must be an integer from 5 to 120.'; exit 1 ;;
          esac
          if [ "$KEEP_ALIVE_MINUTES" -lt 5 ] || [ "$KEEP_ALIVE_MINUTES" -gt 120 ]; then
            echo '::error::keep_alive_minutes must be an integer from 5 to 120.'
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Run PostgreSQL migrations, seed, and verification
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:verify

      - name: Build the existing application
        run: pnpm build

      - name: Verify Cloudflare R2 and product/banner media upload and retrieval
        shell: bash
        run: |
          set -euo pipefail
          probe_file="$GITHUB_WORKSPACE/.staging-r2-media-probe.mts"
          trap 'rm -f "$probe_file"' EXIT
          cat > "$probe_file" <<'EOF'
          import { DeleteObjectCommand, S3Client } from "@aws-sdk/client-s3";
          import { createUploadUrl, objectExists, readObject } from "./server/storage.ts";

          const config = {
            endpoint: process.env.S3_ENDPOINT,
            region: process.env.S3_REGION,
            bucket: process.env.S3_BUCKET,
            accessKeyId: process.env.S3_ACCESS_KEY_ID,
            secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
            forcePathStyle: process.env.S3_FORCE_PATH_STYLE === "true",
          };
          if (!config.endpoint || !config.region || !config.bucket || !config.accessKeyId || !config.secretAccessKey) {
            throw new Error("Required R2 configuration is missing.");
          }
          const client = new S3Client({ endpoint: config.endpoint, region: config.region, forcePathStyle: config.forcePathStyle, credentials: { accessKeyId: config.accessKeyId, secretAccessKey: config.secretAccessKey } });
          const body = Buffer.from("temporary-staging-media-probe");
          const keys = [
            `merchant/staging-product-${process.env.GITHUB_RUN_ID ?? Date.now()}.png`,
            `merchant/staging-banner-${process.env.GITHUB_RUN_ID ?? Date.now()}.png`,
          ];
          try {
            for (const key of keys) {
              const signed = await createUploadUrl({ key, contentType: "image/png", size: body.length });
              const uploaded = await fetch(signed.uploadUrl, { method: "PUT", headers: { "content-type": "image/png", "content-length": String(body.length) }, body });
              if (!uploaded.ok) throw new Error(`${key}: signed upload returned ${uploaded.status}`);
              if (!(await objectExists(key))) throw new Error(`${key}: object was not present after upload`);
              const object = await readObject(key);
              if (!object || !object.body.equals(body) || object.contentType !== "image/png") throw new Error(`${key}: retrieved object did not match the uploaded content`);
              console.log(`R2 media probe passed for ${key}`);
            }
          } finally {
            await Promise.all(keys.map((Key) => client.send(new DeleteObjectCommand({ Bucket: config.bucket, Key }))));
          }
          EOF
          pnpm exec tsx "$probe_file"

      - name: Diagnose R2 HeadBucket readiness operation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_file="$GITHUB_WORKSPACE/.staging-r2-headbucket-diagnostic.mts"
          trap 'rm -f "$diagnostic_file"' EXIT
          cat > "$diagnostic_file" <<'EOF'
          import { HeadBucketCommand, S3Client } from "@aws-sdk/client-s3";

          const endpoint = process.env.S3_ENDPOINT;
          const region = process.env.S3_REGION;
          const bucket = process.env.S3_BUCKET;
          const accessKeyId = process.env.S3_ACCESS_KEY_ID;
          const secretAccessKey = process.env.S3_SECRET_ACCESS_KEY;
          const forcePathStyle = process.env.S3_FORCE_PATH_STYLE === "true";
          if (!endpoint || !region || !bucket || !accessKeyId || !secretAccessKey) throw new Error("Required R2 configuration is missing.");
          const client = new S3Client({ endpoint, region, forcePathStyle, credentials: { accessKeyId, secretAccessKey } });
          try {
            await client.send(new HeadBucketCommand({ Bucket: bucket }));
            console.log(JSON.stringify({ operation: "HeadBucket", result: "passed" }));
          } catch (error) {
            const sdkError = error as { name?: string; message?: string; Code?: string; code?: string; $metadata?: { httpStatusCode?: number; requestId?: string; extendedRequestId?: string } };
            console.log(JSON.stringify({ operation: "HeadBucket", result: "failed", name: sdkError.name ?? null, code: sdkError.Code ?? sdkError.code ?? null, httpStatusCode: sdkError.$metadata?.httpStatusCode ?? null, requestIdPresent: Boolean(sdkError.$metadata?.requestId), extendedRequestIdPresent: Boolean(sdkError.$metadata?.extendedRequestId), message: sdkError.message ?? null }));
            process.exitCode = 1;
          }
          EOF
          pnpm exec tsx "$diagnostic_file"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset="cloudflared-linux-amd64" ;;
            aarch64|arm64) asset="cloudflared-linux-arm64" ;;
            *) echo '::error::Unsupported runner architecture.'; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/${asset}" \
            --output "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "CLOUDFLARED=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"

      - name: Start the real Express API
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm start > "$RUNNER_TEMP/express.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/express.pid"
          for attempt in $(seq 1 45); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/health" > "$RUNNER_TEMP/health.json"; then
              echo "Express API is listening on port ${PORT}."
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/express.log"
          exit 1

      - name: Start Cloudflare Quick Tunnel and capture URL
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup "$CLOUDFLARED" tunnel --no-autoupdate --url "http://127.0.0.1:${PORT}" \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"
          tunnel_url=""
          for attempt in $(seq 1 60); do
            tunnel_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)"
            if [ -n "$tunnel_url" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$tunnel_url" ]; then
            echo '::error::Cloudflare Quick Tunnel did not produce a temporary URL.'
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi
          printf 'staging_api_url=%s\n' "$tunnel_url" >> "$GITHUB_OUTPUT"
          printf 'STAGING_API_URL=%s\n' "$tunnel_url" >> "$GITHUB_ENV"
          echo "TEMPORARY_STAGING_API_URL=$tunnel_url"
          {
            echo '## Temporary staging URL'
            echo
            echo "$tunnel_url"
            echo
            echo '> This URL is temporary and exists only while this workflow job and tunnel are running.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public API health, readiness, and CORS
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in health ready; do
            verified=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 15 "$STAGING_API_URL/$endpoint"; then
                verified=true
                echo
                break
              fi
              sleep 2
            done
            if [ "$verified" != true ]; then
              echo "::error::Temporary tunnel did not serve /$endpoint after DNS/connectivity retries."
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
          done
          allowed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://usamabhanbhro.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            "$STAGING_API_URL/api/catalog")"
          disallowed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://not-allowed.example' \
            -H 'Access-Control-Request-Method: GET' \
            "$STAGING_API_URL/api/catalog")"
          test "$allowed_status" = 204
          test "$disallowed_status" = 403
          echo "CORS checks passed: allowed=${allowed_status}, disallowed=${disallowed_status}."

      - name: Verify security headers and protected admin boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/health.headers" --output /dev/null "$STAGING_API_URL/health"
          for header in \
            'X-Content-Type-Options: nosniff' \
            'X-Frame-Options: DENY' \
            'Referrer-Policy: strict-origin-when-cross-origin' \
            'Permissions-Policy: camera=(), microphone=(), geolocation=()' \
            'Strict-Transport-Security: max-age=31536000; includeSubDomains'; do
            grep --ignore-case --fixed-strings -- "$header" "$RUNNER_TEMP/health.headers" >/dev/null || { echo "::error::Missing security header: $header"; exit 1; }
          done
          admin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_API_URL/api/admin/bootstrap")"
          test "$admin_status" = 401
          echo "Security headers passed; unauthenticated admin boundary remains protected with status ${admin_status}."
          echo 'OAuth is intentionally not configured; authenticated admin operations remain blocked until a real provider is added.'

      - name: Install Chromium for staging API tests
        run: pnpm exec playwright install chromium

      - name: Run existing API tests against staging instance
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_API_URL }}
        run: pnpm exec playwright test tests/e2e/release.spec.ts --grep '^API security:'

      - name: Configure temporary Pages deployment
        if: ${{ inputs.deploy_pages }}
        id: pages
        uses: actions/configure-pages@v5

      - name: Build temporary Pages artifact against the tunnel
        if: ${{ inputs.deploy_pages }}
        env:
          VITE_API_BASE_URL: ${{ steps.tunnel.outputs.staging_api_url }}
          VITE_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm build:pages
          cp dist/public/index.html dist/public/404.html

      - name: Upload temporary Pages artifact
        if: ${{ inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

      - name: Deploy temporary Pages artifact
        if: ${{ inputs.deploy_pages }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep temporary staging alive
        shell: bash
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          cleanup() {
            if [ -f "$RUNNER_TEMP/express.pid" ]; then kill "$(cat "$RUNNER_TEMP/express.pid")" 2>/dev/null || true; fi
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true; fi
          }
          trap cleanup EXIT INT TERM
          end_at=$(( $(date +%s) + KEEP_ALIVE_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end_at" ]; do
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_API_URL/health" || true)"
            tunnel_status="down"
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ] && kill -0 "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null; then
              tunnel_status="up"
            fi
            printf '[staging] api=%s tunnel=%s remaining_seconds=%s url=%s\n' \
              "$api_status" "$tunnel_status" "$((end_at - $(date +%s)))" "$STAGING_API_URL"
            sleep 60
          done

      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-staging-logs
          path: |
            ${{ runner.temp }}/express.log
            ${{ runner.temp }}/cloudflared.log
          if-no-files-found: ignore

      - name: Clean up staging processes
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/express.pid" ]; then kill "$(cat "$RUNNER_TEMP/express.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true; fi
